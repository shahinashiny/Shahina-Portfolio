services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000","9001:9001"]
    volumes: ["minio_data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c","until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done; mc mb --ignore-existing local/attendance-data"]
    restart: "no"
  mlflow:
    build: .
    command: ["mlflow","server","--host","0.0.0.0","--port","5000","--backend-store-uri","postgresql+psycopg2://attendance:attendance@postgres:5432/attendance","--default-artifact-root","/mlartifacts"]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5000:5000"]
    volumes: ["./mlartifacts:/mlartifacts"]
  api:
    build: .
    command: ["uvicorn","src.api:app","--host","0.0.0.0","--port","8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://attendance:attendance@postgres:5432/attendance
      MLFLOW_TRACKING_URI: http://mlflow:5000
      S3_BUCKET: attendance-data
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      DATA_DIR: /app/data
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ports: ["8080:8080"]
    volumes:
      - ./:/opt/project
      - ./airflow/dags:/opt/airflow/dags
volumes:
  postgres_data:
  minio_data: